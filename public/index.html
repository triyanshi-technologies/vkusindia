<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>VKUS India — choose language</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #1e211b; background: #faf9f6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(30rem, calc(100% - 3rem)); text-align: center; }
      h1 { margin: 0 0 0.75rem; font: 600 clamp(2rem, 8vw, 3rem)/1.1 Georgia, serif; }
      p { margin: 0 0 2rem; color: #5f6259; }
      nav { display: flex; justify-content: center; gap: 0.75rem; }
      a { min-width: 7rem; padding: 0.9rem 1.2rem; border: 1px solid #d8d8d0; border-radius: 999px; color: inherit; text-decoration: none; font-weight: 600; }
      a:hover, a:focus-visible { background: #e9ebdc; border-color: #a2a88a; }
    </style>
    <script>
      const locale = navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en";
      window.location.replace(new URL(`./${locale}/`, window.location.href));
    </script>
  </head>
  <body>
    <main>
      <h1>VKUS India</h1>
      <p>Select a language / Выберите язык</p>
      <nav aria-label="Language">
        <a href="./ru/" lang="ru">Русский</a>
        <a href="./en/" lang="en">English</a>
      </nav>
    </main>
  </body>
</html>
